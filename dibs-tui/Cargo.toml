[package]
name = "dibstop"
version = "0.1.0"
edition = "2021"
description = "Live view of the benchmark machine's lock, and a way to act on what is holding it"

[[bin]]
name = "dibstop"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
strip = true
