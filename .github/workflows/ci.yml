name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned, so a new release's lints cannot fail a push that changed nothing.
  RUST: 1.99.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # A test target with test = false is left out of --all-targets.
      - run: cargo clippy -p dibs --test live -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          components: clippy
      # The lint job runs on Linux, so code behind cfg(target_os = "macos") is linted only here.
      - name: Lints on macOS
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: The tools dibs runs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rsync psmisc
      - name: Homebrew's bash and GNU tools, ahead of macOS's own
        if: runner.os == 'macOS'
        run: |
          brew install bash coreutils findutils gnu-sed grep gawk rsync flock
          prefix=$(brew --prefix)
          echo "$prefix/bin" >> "$GITHUB_PATH"
          for tool in coreutils findutils gnu-sed grep gawk; do
            echo "$prefix/opt/$tool/libexec/gnubin" >> "$GITHUB_PATH"
          done
      - run: cargo test

  # The suite's cargo is a fake, so only a real one shows that each runner a machine builds into
  # the shared target is its own source's.
  runner-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
      - run: cargo test -p dibs --test suite -- --ignored --exact runner::a_second_source_is_built_into_the_target_the_first_left

  window:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
      - run: cargo test -p dibs-machines

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - run: cargo build --locked
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - run: cargo +1.95 build --locked -p dibs-machines

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No private name in the tree or in what this push says
        env:
          PRIVATE_STRINGS: ${{ secrets.PRIVATE_STRINGS }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$PRIVATE_STRINGS" ]; then
            echo "::warning::PRIVATE_STRINGS is not set, so nothing was scanned"
            exit 0
          fi
          patterns=$(printf '%s\n' "$PRIVATE_STRINGS" | grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' || true)
          if [ -z "$patterns" ]; then
            echo "::error::PRIVATE_STRINGS holds only comments and blank lines, so there is nothing to scan for"
            exit 1
          fi
          from=${BASE:-$BEFORE}
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            from=$(git merge-base "$HEAD" "origin/${{ github.event.repository.default_branch }}" 2>/dev/null || true)
          fi
          range=${from:+$from..}$HEAD
          # The patterns are secret, so the log names neither them nor a path that holds one.
          bad=0
          n=0
          while IFS= read -r pat; do
            n=$((n + 1))
            if git ls-tree -r --name-only "$HEAD" | grep -q -i -e "$pat"; then
              echo "a file's path holds private pattern $n"; bad=1
            fi
            for f in $(git grep -l -i -e "$pat" "$HEAD" -- . | sed "s|^$HEAD:||"); do
              printf '%s\n' "$f" | grep -q -i -e "$pat" && continue
              echo "private pattern $n is in $f"; bad=1
            done
            for c in $(git rev-list "$range"); do
              # GitHub names the branch's owner in this line, and a login is not ours to vet.
              if git log -1 --format=%B "$c" | sed '1{/^Merge pull request #[0-9]* from /d;}' | grep -q -i -e "$pat"; then
                echo "private pattern $n is in the message of $c"; bad=1
              fi
            done
          done <<< "$patterns"
          exit "$bad"
