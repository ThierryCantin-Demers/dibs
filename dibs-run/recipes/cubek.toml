# --- tests: shared lock, because correctness runs are not measurements -------------------
#
# These exist because CI has no CUDA. `cargo xtask test --ci` runs the suite against wgpu on
# a GitHub runner, so every CUDA-only path in the kernels reaches a device for the first time
# here or not at all.
#
# --release is not a speed preference. The suite compares each GPU result against
# `cpu_reference`, which is a single-threaded O(MNK) loop on the host; unoptimized it, not the
# kernels, is what the wall clock measures.

[test.cuda]
  [[test.cuda.step]]
  lock = "shared"
  run  = "cargo test --release -p cubek-matmul --features cubecl/cuda"

# The `extended` tier is never compiled by the test job in CI, only clippy-checked, so a
# compile error in it survives a green CI run.
[test.cuda-extended]
  [[test.cuda-extended.step]]
  lock = "shared"
  run  = "cargo test --release -p cubek-matmul --features cubecl/cuda,extended"
