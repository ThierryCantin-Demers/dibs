# Bundled with dibs-run. Override any of it in ~/.config/dibs/recipes/cubek.toml
#
# Reproducibility does not depend on this file surviving: every run record carries the whole
# procedure it ran, not a reference to it, so an old result stays readable after the recipe
# that produced it has been edited or deleted.
#
# THE FOOTGUN THIS FILE EXISTS TO CLOSE. The benchmarks package declares no backend of its
# own; the backend comes from a cubecl feature. cubecl's build script counts the enabled
# runtimes among {cpu, cuda, hip, metal-native, wgpu} and, if the count is anything other than
# exactly one, silently falls back to wgpu. So a recipe with two backend features, or none,
# produces a number measured on hardware nobody chose. Every recipe here names exactly one.
#
# `needs` is deliberately absent. It is the right place to say "this wants tensor cores", but
# the current backend knows one machine and cannot check it, so dibs-run refuses rather than
# routing a CMMA benchmark to a card without them. Add it when routing exists.

# --- builds: shared lock, because compiling tolerates neighbours ------------------------

[build.cuda]
  [[build.cuda.step]]
  lock = "shared"
  run  = "cargo build --release -p benchmarks --features cubecl/cuda"

[build.cpu]
  [[build.cpu.step]]
  lock = "shared"
  run  = "cargo build --release -p benchmarks --features cubecl/cpu"

# --- benchmarks: build shared, measure exclusive ----------------------------------------
#
# The split is the whole point of two steps. Compiling under the exclusive lock held the
# machine for 31.8 minutes across two runs on the machine, 17% of all exclusive time ever
# recorded there, doing something that tolerates neighbours perfectly.
#
# A cubek bench target takes no filter: `--bench gemm` runs its whole strategy x problem
# matrix. CUBEK_BENCH_SAMPLES sets samples per pair, default 10.

[bench.gemm]
isolation = "machine"
  [[bench.gemm.step]]
  lock = "shared"
  run  = "cargo build --release -p benchmarks --bench gemm --features cubecl/cuda"
  [[bench.gemm.step]]
  lock = "exclusive"
  run  = "cargo bench -p benchmarks --bench gemm --features cubecl/cuda"

