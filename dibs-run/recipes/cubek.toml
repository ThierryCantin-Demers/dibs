# The CPU runtime, one recipe per kernel family a decode step launches. A CPU measurement
# wants the whole machine regardless, which is the default isolation.
#
# Suffixed rather than bare because the same families exist on cuda above, and a name that
# does not say its backend is a trap on a machine whose cards do not all share one.
[bench.gemm-cpu]
isolation = "machine"
  [[bench.gemm-cpu.step]]
  lock = "shared"
  run  = "cargo build --release -p benchmarks --bench gemm_cpu --features cubecl/cpu"
  [[bench.gemm-cpu.step]]
  lock = "exclusive"
  run  = "cargo bench -p benchmarks --bench gemm_cpu --features cubecl/cpu"

