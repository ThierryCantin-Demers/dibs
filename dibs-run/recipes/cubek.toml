# Named by `dibs-run gaps`: "conv2d and random benches have no recipe; re-measuring rows after
# the curve migration". Both are plain bench targets in the same package, so they take the same
# shape as the ones above and needed nothing but writing down.
[bench.conv2d]
isolation = "machine"
  [[bench.conv2d.step]]
