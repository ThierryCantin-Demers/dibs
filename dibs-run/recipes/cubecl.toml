# Bundled with dibs-run. Override any of it in ~/.config/dibs/recipes/cubecl.toml
#
# The device benchmarks here are the `throughput` example package, so they are `--example`
# targets rather than `--bench` ones, and their feature names are bare (`cuda`, `wgpu`) rather
# than `cubecl/cuda`. That differs from cubek on both counts.
#
# `--release` is not optional: throughput's own README says a debug build measures the wrong
# thing, which is true of every one of these.
#
# CUBECL_THROUGHPUT_CACHE=off forces a fresh peak-throughput measurement instead of reusing
# the cached ceiling for the device. Anything reporting a percentage of peak should set it, or
# the percentage is against a number measured at some other time under some other conditions.
#
# One backend per recipe, named in the recipe. The families below used to be bare and mean
# cuda, which reads as "the general one" and is why every non-CUDA curve was measured through
# the escape hatch instead: `dibs-run gaps` named that twice before it was noticed. A name
# that does not say its backend is a trap on a machine whose cards do not all share one.
#
# The measured step repeats, so one exclusive hold reports run-to-run spread rather than a
# single number that nothing can be compared against. It is inside the hold on purpose: three
# runs separated by someone else's build are three different machines.

[build.cuda]
  [[build.cuda.step]]
  lock = "shared"
  run  = "cargo build --release -p throughput --features cuda --examples"

[bench.throughput-all-cuda]
isolation = "machine"
  [[bench.throughput-all-cuda.step]]
  lock = "shared"
  run  = "cargo build --release -p throughput --features cuda --example all"
  [[bench.throughput-all-cuda.step]]
  lock = "exclusive"
  run  = "for i in 1 2 3; do echo \"== run $i\"; CUBECL_THROUGHPUT_CACHE=off cargo run -q --release -p throughput --features cuda --example all; done"

[bench.throughput-all-vulkan]
isolation = "machine"
  [[bench.throughput-all-vulkan.step]]
