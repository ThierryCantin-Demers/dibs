# compute_cmma reports `unsupported` rather than failing on a device without tensor cores: the
# gate is `client.properties().features.matmul.cmma` being empty. That is the field a `needs`
# expression should eventually be written against.
[bench.compute-cmma]
isolation = "machine"
  [[bench.compute-cmma.step]]
  lock = "shared"
  run  = "cargo build --release -p throughput --features cuda --example compute_cmma"
  [[bench.compute-cmma.step]]
  lock = "exclusive"
  run  = "CUBECL_THROUGHPUT_CACHE=off cargo run --release -p throughput --features cuda --example compute_cmma"

[bench.launch-overhead]
isolation = "machine"
  [[bench.launch-overhead.step]]
