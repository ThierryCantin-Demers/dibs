  [[bench.launch-overhead.step]]
  lock = "exclusive"
  run  = "cargo run --release -p throughput --features cuda --example launch_overhead"

# --- tests: shared lock, because correctness runs are not measurements -------------------
#
# `xtask test --ci` excludes cubecl-cuda outright, along with hip and metal, because the
# GitHub runners have no such device. So `testgen_all!` over every dtype pairing, the dynamic
# launch count suite, and the quantized view tests have no CI coverage at all: this recipe is
# the only place they run.
#
# Debug, unlike cubek's test recipe, because these assert over small tensors and the host side
# is not what takes the time.

[test.cuda]
  [[test.cuda.step]]
  lock = "shared"
  run  = "cargo test -p cubecl-cuda"
