# memory_curve is the one that answers what a kernel moving a given amount can actually hit;
# the single-size probes above report only the last row of its table.
[bench.memory-curve-cuda]
isolation = "machine"
  [[bench.memory-curve-cuda.step]]
  lock = "shared"
  run  = "cargo build --release -p throughput --features cuda --example memory_curve"
  [[bench.memory-curve-cuda.step]]
  lock = "exclusive"
  run  = "for i in 1 2; do echo \"== run $i\"; CUBECL_THROUGHPUT_CACHE=off cargo run -q --release -p throughput --features cuda --example memory_curve; done"

[bench.memory-curve-vulkan]
