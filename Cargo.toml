[workspace]
resolver = "3"
members = ["crates/dibs-core", "crates/dibs-format", "crates/dibstop", "crates/dibs-machines"]
# The window builds a GUI toolkit, which most installs never ask for and every test run would.
default-members = ["crates/dibs-core", "crates/dibs-format", "crates/dibstop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Let chains need 1.88 and File::try_lock 1.89.
rust-version = "1.89"

[workspace.dependencies]
dibs-format = { path = "crates/dibs-format" }
crossterm = "0.28"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
libc = "0.2"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 2
strip = true
