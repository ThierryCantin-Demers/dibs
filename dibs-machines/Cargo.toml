[package]
name = "dibs-machines"
version = "0.1.0"
edition = "2021"
description = "A window on dibs machines: what each machine lacks against what it should have"

[[bin]]
name = "dibs-machines"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
strip = true
